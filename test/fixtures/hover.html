<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hover Fixture</title>
  </head>
  <body>
    <h1>Hover Fixture</h1>
    <!-- Hovering #target changes the title, so the hover is observable. -->
    <div id="target" onmouseover="document.title='Hovered!'">hover me</div>
    <div id="note">not the target</div>
  </body>
</html>
